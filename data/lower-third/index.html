<!doctype html>
<!--
  BGH LIVE lower third: four themes

  OBS's "Lower Third" source draws this page full-screen and tells it what to do with one event:
    window event "churchLowerThird", detail = { action: "show", name: "Simon Becerra", subtitle: "Barrington, NJ", theme: "barrington" }
                                     detail = { action: "hide" }
  Themes (chosen per scene collection in the BGH LIVE Controller's Settings, or in the source's settings in OBS):
    barrington  the name in Montserrat Medium over a cropped Spectral Bold "B", with an optional subtitle under it
                in small capitals (Montserrat Medium); the controller sends one only for visiting speakers when it's switched on
    conference  the name and subtitle exactly as Barrington, no "B", in its own colour ("color", a hex code) at
                the same opacity. Behind them, "Conference" in Yellowtail in a darker shade of that colour, part of the
                box: uncovered as the box extends, covered as it closes, drifting slowly left while it's up
    christmas   like Barrington without the "B", in red (#B32929) easing from deeper at the top to a lighter rose
                at the bottom, with small snowflakes falling inside; a sprig with a star sits on the box's
                left edge and fades in from the right while the box extends, before the name
    sundayschool  like Barrington without the "B", in solid blue (#449DD1) with three big darker circles (#2B6689)
                bouncing around inside the box and off each other
  Showing: a small box appears, extends to the right, then the words fade in. Hiding: the same in reverse.
  A new name while one is up swaps in place: the old name fades out, the box eases to the new length and the
  new name fades in (the plug-in restarts the hide-after timer). A change of theme hides and reopens instead.

  To use your own design, make any .html page that listens for that event, then pick it under
  "Custom design" in the Lower Third's settings in OBS. Nothing needs rebuilding.
  Preview in an ordinary browser: open this file and add ?demo=Simon%20Becerra to the address.
  Add &theme=conference&subtitle=Barrington%2C%20NJ for the Conference theme (&color=%235A2A27 for its colour),
  &theme=christmas or &theme=sundayschool for the others;
  &hold keeps it up.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lower Third</title>
<style>
  @font-face { font-family: "Spectral"; src: url("fonts/Spectral-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Yellowtail"; src: url("fonts/Yellowtail-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; }

  :root {
    /* Change these to restyle without touching anything else */
    --box-opacity: 0.9;                /* the see-through level set in the controller (50-100 %), every theme but Sunday School */
    --box: rgba(19, 41, 50, var(--box-opacity));   /* #132932, same as the hymn box */
    --letter: #122932;                 /* Barrington: the cropped B behind the name */
    --text: #ffffff;
    --subtitle: rgba(255, 255, 255, 0.82);
    --font: "Montserrat", "Segoe UI", sans-serif;
    --serif: "Spectral", Georgia, serif;
    --name-size: 2.1vw;                /* Barrington name: about 40px on a 1080p canvas */
    --script-size: calc(var(--height) * 2.1);    /* Conference: the word "Conference" behind the name */
    --script-top: calc(var(--height) * -0.62);   /* how far above the box it starts, so the box crops its top */
    --write-time: 2400ms;              /* how long the pen takes to write "Conference" */
    --script-pan: 7vw;                 /* how far it drifts left... */
    --script-pan-time: 16s;            /* ...over this long */
    --sub-size: 0.95vw;                /* Barrington subtitle: about 18px, in capitals */
    --radius: 0.55vw;                  /* same corners as the hymn box */
    --left: 6.3vw;                     /* about 120px from the left edge */
    --bottom: 6.6vh;                   /* about 72px up from the bottom, level with the hymn box */
    --height: 8.2vw;                   /* about 157px, the same height as the hymn box */
    --min-width: 33.8vw;               /* about 650px; longer names make it longer */
    --open-time: 600ms;
    --sub-lag: 150ms;
    --b-time: 700ms;                   /* Barrington: the B fading in from the left */                  /* the subtitle fades in this long after the name */
    /* Christmas: #B32929 at c2 at the top, easing to a light rose (#D0787A) at the bottom, as in the reference image.
       The bottom stays about as solid as the top, so it looks the same over a light wall or a dark suit. */
    --christmas: linear-gradient(180deg, rgba(179, 41, 41, var(--box-opacity)) 0%, rgba(208, 120, 122, min(1, calc(var(--box-opacity) + 0.06))) 100%);
    --sundayschool: #449dd1;          /* solid, no see-through */
    --circle: #2b6689;                 /* Sunday School: the bouncing circles */
    --deco-time: 450ms;                /* Christmas: the sprig fading in */
  }

  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }

  .lt {
    position: absolute; left: var(--left); bottom: var(--bottom);
    height: var(--height); width: var(--height);
    background: var(--box); border-radius: var(--radius);
    overflow: hidden;
    opacity: 0; transform: scale(0.94); transform-origin: left center;
    transition: opacity 280ms ease, transform 280ms ease, width var(--open-time) cubic-bezier(.65, 0, .35, 1);
  }
  .lt.up { opacity: 1; transform: none; }

  /* Barrington: the big B, cropped by the box, so only its middle shows */
  .letter {
    position: absolute; left: 1.75vw; top: 50%;
    transform: translateY(-50%);
    font-family: var(--serif); font-weight: 700;
    font-size: calc(var(--height) * 2.05); line-height: 1;
    color: var(--letter);
    pointer-events: none; user-select: none;
  }
  .lt.conference .letter, .lt.christmas .letter, .lt.sundayschool .letter { display: none; }
  /* Barrington: the B fades in from a little to the left as the box opens. Going away it just stays put and the
     box closes over it, as before (the class comes off only once the box is gone). */
  .lt.barrington .letter { opacity: 0; margin-left: -0.9vw; }
  .lt.barrington.b-in .letter { opacity: 1; margin-left: 0; transition: opacity var(--b-time) ease, margin-left var(--b-time) cubic-bezier(.2, .7, .3, 1); }

  /* Christmas: the sprig and star on the box's left edge, reaching above and below it */
  .xmas-deco {
    position: absolute;
    height: calc(var(--height) * 1.46);
    width: calc(var(--height) * 1.46 * 88 / 491);
    left: calc(var(--left) - var(--height) * 1.46 * 88 / 491 * 0.37);
    bottom: calc(var(--bottom) - var(--height) * 0.23);
    opacity: 0; transform: translateX(0.6vw);
    transition: opacity var(--deco-time) ease, transform var(--deco-time) ease;
    pointer-events: none;
    z-index: 2;   /* in front of the see-through box, as in the design */
  }
  .xmas-deco.on { opacity: 1; transform: none; }

  /* Sunday School: circles drifting and bouncing inside the box, behind the words */
  .dots { position: absolute; inset: 0; display: none; }
  .lt.sundayschool .dots { display: block; }
  /* Christmas: snow falling inside the box, behind the words */
  .snow { position: absolute; inset: 0; display: none; }
  .lt.christmas .snow { display: block; }
  .flake { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; will-change: transform; }
  .dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--circle); will-change: transform; }
  .words { z-index: 1; }

  .words {
    position: absolute; left: 3.25vw; right: 3.25vw; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0.3vw;
    white-space: nowrap;
    opacity: 0; transition: opacity 360ms ease;
  }
  .words.on { opacity: 1; }
  /* The subtitle follows the name a moment later (--sub-lag), in every theme; going away, they leave together */
  .words .subtitle { opacity: 0; transition: opacity 360ms ease; }
  .words.on .subtitle { opacity: 1; transition-delay: var(--sub-lag); }
  .name { font-family: var(--font); font-weight: 500; font-size: var(--name-size); color: var(--text); line-height: 1.15; }
  /* Barrington: a visiting speaker's subtitle under the name, small capitals in Montserrat Medium */
  .subtitle { display: block; font-family: var(--font); font-weight: 500; font-size: var(--sub-size); color: var(--text); text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.2; }
  .subtitle:empty { display: none; }

  /* Conference: "Conference" in Yellowtail behind the name, in a darker shade of the box colour (--script).
     It's part of the box, so the box's edges crop it (overflow: hidden) and it closes away with the box.
     It's written out with a pen as the box extends, and drifts slowly left while it's up. */
  /* The word is drawn from Yellowtail's own outlines (the same shapes as the font, set by HarfBuzz as the
     browser would), so it can be written out with a pen: a mask of short strokes along the middle of each
     letter, in writing order, each as wide as the letter is there. --s and --l are where each stroke starts
     and how long it is, as shares of the whole route, so the pen moves at an even speed. At the end the plain
     word fades in under it, so no tip is left unwritten. Sizes: the SVG is laid out so the word sits exactly
     where the text did (font-size --script-size, line-height 1, top --script-top). */
  .script {
    position: absolute; display: none;
    left: calc(0.3vw - var(--script-size) * 0.0293);
    top: calc(var(--script-top) - var(--script-size) * 0.166);
    height: calc(var(--script-size) * 1.3315); width: calc(var(--script-size) * 4.0151);
    pointer-events: none; transform: translateX(0);
  }
  .lt.conference .script { display: block; }
  .script .word, .script .word-full { fill: var(--script, #0b1418); }
  .script .word-full { opacity: 0; }
  .script .pen path { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  .script.write .pen path { animation: pen calc(var(--l) * var(--write-time)) linear calc(var(--s) * var(--write-time)) both; }
  .script.write .word-full { opacity: 1; transition: opacity 250ms ease var(--write-time); }
  @keyframes pen { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .script.drift { transform: translateX(calc(var(--script-pan) * -1)); transition: transform var(--script-pan-time) linear; }
</style>
</head>

    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="snow" id="snow" aria-hidden="true"></div>
    <div class="words" id="words">
      <span class="name" id="name"></span>
      <span class="subtitle" id="subtitle"></span>
    </div>

<script>
  const box = document.getElementById("lt");
  const words = document.getElementById("words");
  const nameEl = document.getElementById("name");
  const subEl = document.getElementById("subtitle");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const px = n => window.innerWidth * parseFloat(css(n)) / 100;
  const wait = t => new Promise(r => setTimeout(r, t));
  const OPEN = () => parseFloat(css("--open-time")) || 600;
  let step = 0;      // a newer command cancels an older animation still running
  let current = "";

  // Width for these words: at least the minimum, longer for long names (up to most of the screen)
  function widthFor() {
    [nameEl, subEl].forEach(e => e.style.fontSize = "");
    const pad = window.innerWidth * 0.065;   // space on both sides of the words
    const need = () => Math.max(nameEl.scrollWidth, subEl.offsetParent ? subEl.scrollWidth : 0);
    let w = Math.max(px("--min-width"), need() + pad);
    const max = window.innerWidth * 0.8;
    if (w > max) {   // very long: shrink the text to fit
      const k = (max - pad) / need();
      [nameEl, subEl].forEach(e => e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * k + "px");
      w = max;
    }
    return w;
  }

  const deco = document.getElementById("deco");
  const dotsEl = document.getElementById("dots");
  const THEMES = ["barrington", "conference", "christmas", "sundayschool"];
  const script = document.getElementById("script");

  /* The darker shade for "Conference", one fixed step darker than the box colour (#132932 → #0B1418):
     in HSL, keep the hue, multiply lightness by 35/69 and saturation by (13/35) ÷ (31/69) = 0.82673. */
  function darker(hex) {
    let h = String(hex || "").replace(/^#/, "");
    if (/^[0-9a-f]{3}$/i.test(h)) h = h.replace(/./g, c => c + c);
    if (!/^[0-9a-f]{6}$/i.test(h)) h = "132932";
    const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let H = 0, S = 0, L = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      S = L > 0.5 ? d / (2 - max - min) : d / (max + min);
      H = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      H /= 6;
    }
    L *= 35 / 69; S *= (13 / 35) / (31 / 69);
    const hue = (p, q, t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    let rgb;
    if (S === 0) rgb = [L, L, L];
    else { const q = L < 0.5 ? L * (1 + S) : L + S - L * S, p = 2 * L - q; rgb = [hue(p, q, H + 1 / 3), hue(p, q, H), hue(p, q, H - 1 / 3)]; }
    return "#" + rgb.map(v => Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, "0")).join("").toUpperCase();
  }
  const DECO = () => parseFloat(css("--deco-time")) || 450;

  /* Movement inside the box (one animation loop for both):
     Sunday School: three big circles that bounce off the box's edges and off each other. A circle's centre stays
       inside the box, so part of it can be hidden past an edge.
     Christmas: small, slightly see-through snowflakes falling and swaying, behind the name.
     Both use the width the box is opening to (fieldW), so they're already in place and the box uncovers them. */
  const snowEl = document.getElementById("snow");
  const dots = [], flakes = [];
  let fxRaf = 0, fxLast = 0, fieldW = 0;
  const fieldH = () => box.clientHeight || px("--height");
  function fxFrame(now) {
    const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
    const W = Math.max(fieldW, box.clientWidth), H = fieldH();
    // Circles: move, bounce off the edges...
    for (const d of dots) {
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.x < 0) { d.x = 0; d.vx = Math.abs(d.vx); } else if (d.x > W) { d.x = W; d.vx = -Math.abs(d.vx); }
      if (d.y < 0) { d.y = 0; d.vy = Math.abs(d.vy); } else if (d.y > H) { d.y = H; d.vy = -Math.abs(d.vy); }
    }
    // ...and off each other: pushed apart where they overlap, and an elastic bounce (heavier = bigger)
    for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
      const a = dots[i], b = dots[j];
      let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
      const min = a.r + b.r;
      if (dist >= min) continue;
      if (dist < 0.01) { dx = 1; dy = 0; dist = 1; }
      const nx = dx / dist, ny = dy / dist, ma = a.r * a.r, mb = b.r * b.r, over = min - dist;
      a.x -= nx * over * mb / (ma + mb); a.y -= ny * over * mb / (ma + mb);
      b.x += nx * over * ma / (ma + mb); b.y += ny * over * ma / (ma + mb);
      const along = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (along < 0) {
        const k = 2 * along / (ma + mb);
        a.vx += k * mb * nx; a.vy += k * mb * ny;
        b.vx -= k * ma * nx; b.vy -= k * ma * ny;
      }
    }
    for (const d of dots) {
      d.x = Math.min(W, Math.max(0, d.x)); d.y = Math.min(H, Math.max(0, d.y));
      d.el.style.transform = `translate(${d.x - d.r}px, ${d.y - d.r}px)`;
    }
    // Snow: falls, sways a little, and starts again at the top
    for (const f of flakes) {
      f.y += f.vy * dt; f.t += dt;
      if (f.y > H + f.size) { f.y = -f.size; f.x = Math.random() * W; }
      const x = f.x + Math.sin(f.t * f.sway + f.phase) * H * 0.05;
      f.el.style.transform = `translate(${x}px, ${f.y}px)`;
    }
    fxRaf = requestAnimationFrame(fxFrame);
  }
  function fxRun() { if (!fxRaf) { fxLast = performance.now(); fxRaf = requestAnimationFrame(fxFrame); } }
  function startDots() {
    stopDots();
    const H = fieldH(), W = Math.max(fieldW, px("--min-width"));
    // size (× box height), where it starts (× the width and height) and its speed (box heights a second)
    [[1.3, 0.12, 0.7, 0.6, -0.45], [1.1, 0.5, 0.2, -0.5, 0.5], [0.95, 0.86, 0.85, 0.45, 0.4]].forEach(([size, x, y, vx, vy]) => {
      const el = document.createElement("span"); el.className = "dot";
      el.style.width = el.style.height = size * H + "px";
      dotsEl.appendChild(el);
      dots.push({ el, r: size * H / 2, x: x * W, y: y * H, vx: vx * H, vy: vy * H });
    });
    fxRun();
  }
  function startSnow() {
    stopSnow();
    const H = fieldH(), W = Math.max(fieldW, px("--min-width"));
    const n = Math.round(W / H * 6);   // about 6 flakes for each box-height of width
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span"); el.className = "flake";
      const size = H * (0.022 + Math.random() * 0.022);
      el.style.width = el.style.height = size + "px";
      el.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
      snowEl.appendChild(el);
      flakes.push({ el, size, x: Math.random() * W, y: Math.random() * H, vy: H * (0.16 + Math.random() * 0.14),
                    t: 0, sway: 0.8 + Math.random() * 1.2, phase: Math.random() * 6.3 });
    }
    fxRun();
  }
  function stopDots() { dotsEl.innerHTML = ""; dots.length = 0; if (!flakes.length) { cancelAnimationFrame(fxRaf); fxRaf = 0; } }
  function stopSnow() { snowEl.innerHTML = ""; flakes.length = 0; if (!dots.length) { cancelAnimationFrame(fxRaf); fxRaf = 0; } }

  async function show(d) {
    const theme = THEMES.includes(d.theme) ? d.theme : "barrington";
    const subtitle = String(d.subtitle || "");   // the controller only sends one when it should show
    const key = JSON.stringify([d.name, subtitle, theme, theme === "conference" ? d.color : ""]);
    const mine = ++step;
    setOpacity(d.opacity);
    if (current === key && box.classList.contains("up")) return;
    const up = box.classList.contains("up");
    const sameLook = up && box.dataset.theme === theme && (theme !== "conference" || box.dataset.color === String(d.color || ""));
    if (sameLook) {
      // Another name while one is up (same theme): the words fade out, the box eases to the new length,
      // and the new name fades in. No hide-and-reopen.
      current = key;
      words.classList.remove("on");
      await wait(360); if (mine !== step) return;
      nameEl.textContent = d.name; subEl.textContent = subtitle;
      const w = widthFor(), was = box.getBoundingClientRect().width;
      fieldW = w;
      box.style.width = w + "px";
      if (Math.abs(w - was) > 1) { await wait(OPEN() * 0.8); if (mine !== step) return; }
      words.classList.add("on");
      return;
    }
    if (up) { await hideSteps(mine); if (mine !== step) return; }
    current = key;
    box.classList.remove("b-in");
    THEMES.forEach(t => box.classList.toggle(t, t === theme));
    box.dataset.theme = theme;
    box.dataset.color = String(d.color || "");
    // Conference: its own colour (a hex code), at the same opacity as Barrington. Christmas and Sunday School: fixed.
    const m = String(d.color || "").match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    box.style.setProperty("--box",
      theme === "conference" && m ? `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, var(--box-opacity))`
      : theme === "christmas" ? "var(--christmas)" : theme === "sundayschool" ? "var(--sundayschool)" : "");
    // Conference: "Conference" ready to be written, in the darker shade
    script.classList.remove("drift", "write");
    box.style.setProperty("--script", darker(m ? m[0] : "#132932"));
    nameEl.textContent = d.name; subEl.textContent = subtitle;
    const w = widthFor();
    fieldW = w;
    words.classList.remove("on");
    // 1. a small box appears (Sunday School: its circles already moving inside; Christmas: snow already falling)
    box.style.width = css("--height");
    void box.offsetWidth;
    box.classList.add("up");
    if (theme === "sundayschool") startDots(); else stopDots();
    if (theme === "christmas") startSnow(); else stopSnow();
    // Conference: "Conference" starts being written as soon as the box appears, and starts drifting
    if (theme === "conference") { void script.offsetWidth; script.classList.add("drift", "write"); }
    // Barrington: the B fades in from the left as the box opens
    if (theme === "barrington") { void box.offsetWidth; box.classList.add("b-in"); }
    await wait(300); if (mine !== step) return;
    // 2. it extends (Christmas: the sprig fades in, sliding in from a little to the right, while it does)
    box.style.width = w + "px";
    if (theme === "christmas") {
      deco.style.transitionDuration = OPEN() + "ms";
      deco.classList.add("on");
      setTimeout(() => { deco.style.transitionDuration = ""; }, OPEN() + 50);
    }
    await wait(OPEN()); if (mine !== step) return;
    // 4. the words fade in
    words.classList.add("on");
  }

  // The reverse: the words fade out, then the box shrinks back (Christmas: the sprig fades away while it does),
  // then disappears
  async function hideSteps(mine) {
    words.classList.remove("on");
    await wait(360); if (mine !== step) return;
    if (deco.classList.contains("on")) {
      deco.style.transitionDuration = OPEN() + "ms";   // as long as the box takes to shrink
      deco.classList.remove("on");
      setTimeout(() => { deco.style.transitionDuration = ""; }, OPEN() + 50);
    }
    box.style.width = css("--height");
    await wait(OPEN()); if (mine !== step) return;
    box.classList.remove("up");
    await wait(300);
    if (mine === step) { stopDots(); stopSnow(); box.classList.remove("b-in"); }
  }

  async function hide() {
    const mine = ++step;
    if (!box.classList.contains("up")) { current = ""; return; }
    await hideSteps(mine);
    if (mine === step) current = "";
  }

  // The see-through level, as a percentage (50-100); anything else keeps the current one
  function setOpacity(pct) {
    const v = Number(pct);
    if (v >= 50 && v <= 100) document.documentElement.style.setProperty("--box-opacity", String(v / 100));
  }
  window.addEventListener("churchLowerThird", (e) => {
    let d = e.detail || {};
    if (typeof d === "string") { try { d = JSON.parse(d); } catch { d = {}; } }
    if (d.action === "style") { setOpacity(d.opacity); return; }
    if (d.action === "show" && d.name) show({name:String(d.name), subtitle:d.subtitle, theme:d.theme, color:d.color, opacity:d.opacity});
    else hide();
  });

  // Preview outside OBS
  const q = new URLSearchParams(location.search);
  const demo = q.get("demo");
  if (demo) {
    document.body.style.background = q.get("bg") || "#9aa7b4";
    const names = demo.split("|"), hold = q.has("hold");
    const theme = q.get("theme") || "barrington", subtitle = q.get("subtitle") || "", color = q.get("color") || "";
    let i = 0;
    const cycle = () => { show({name:names[i++ % names.length], subtitle, theme, color}); if (!hold) setTimeout(() => { hide(); setTimeout(cycle, 2200); }, 4500); };
    document.fonts.ready.then(() => setTimeout(cycle, 300));
  }
</script>
</body>
</html>
